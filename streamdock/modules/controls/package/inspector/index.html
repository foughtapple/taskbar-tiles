<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#161b24;color:#e4ebf7;font:13px 'Segoe UI',sans-serif;padding:14px;line-height:1.5}h3{color:#79c9ef}button{background:#2b394c;color:white;border:1px solid #536178;padding:8px;margin:8px 0;border-radius:4px}small{color:#bac3d0}
</style></head><body><h3 id="title">Desktop Controls</h3><p id="detail"></p><button id="setup" hidden>Configure game launchers</button><button id="test" hidden>Test capture (3-second delay)</button><p><small>Managed in Taskbar Tiles → Settings → Stream Dock. No background polling. The existing standalone helpers are left unchanged.</small></p><script>
let ws,ctx,action;function connectElgatoStreamDeckSocket(port,uuid,event,info,actionInfo){ctx=uuid;action=JSON.parse(actionInfo).action;ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>ws.send(JSON.stringify({event,uuid}));const details={rocket:'Open Rocket League if closed; request a normal close if running.',overwatch:'Open or close Overwatch using your saved Steam or Battle.net shortcut choice.',screenshot:'Copy the zone under the pointer. With no valid zone, copy the whole monitor under the pointer. No screenshot files are saved.',clipboard:'Open Windows clipboard history (Win+V).',voice:'Send Ctrl+Alt+Shift+F to the already-running app with that global voice hotkey.'};const key=action.split('.').pop();document.getElementById('detail').textContent=details[key]||'';document.getElementById('setup').hidden=!['rocket','overwatch'].includes(key);document.getElementById('test').hidden=key!=='screenshot';}
function send(command){if(ws&&ws.readyState===1)ws.send(JSON.stringify({event:'sendToPlugin',action,context:ctx,payload:{command}}));}document.getElementById('setup').onclick=()=>send('setup');document.getElementById('test').onclick=()=>send('test');window.connectStreamDockSocket=connectElgatoStreamDeckSocket;
</script></body></html>
