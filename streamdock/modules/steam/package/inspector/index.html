<!doctype html><html><head><meta charset="utf-8"><title>Steam Smart Switch</title><style>body{font:13px system-ui;background:#202225;color:#eee;margin:14px}label{display:block;margin:12px 0}select,button{padding:8px;background:#30343a;color:white;border:1px solid #555;border-radius:5px}select{width:100%}button{margin:4px}#status{white-space:pre-wrap;border-left:3px solid #71b9e4;padding:10px;background:#151719}small{color:#bbb}</style></head><body><h3>Steam Smart Switch</h3><div id="status">Connecting to plugin...</div><label><input id="auto" type="checkbox" checked> Automatically select my two remembered accounts</label><label>First account<select id="first"></select></label><label>Second account<select id="second"></select></label><label><input id="name" type="checkbox" checked> Show current profile name</label><label><input id="web" type="checkbox" checked> Public avatar fallback when no local image is cached</label><button id="save">Save settings</button><button id="refresh">Refresh accounts</button><button id="cancel">Cancel current operation</button><p><small>Five-second visible-only monitoring. Switching waits for Steam games to close and restarts Steam normally. Switch + Rocket League closes Rocket League first. No password or API key is required. A Steam symbol opens Steam without changing account.</small></p><script src="inspector.js"></script></body></html>
