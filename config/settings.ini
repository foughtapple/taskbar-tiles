# Taskbar Tiles 0.7.0. Prefer the settings cog; this file is also editable.
# Save, then reopen the popup. Changes do not require rebuilding.
ConfigVersion=9

# APPEARANCE (logical pixels, before Windows display scaling)
TileSize=120
# Preview scale is a percentage. 120 = larger 336 x 196 cards before fitting.
PreviewScale=120
MaxPanelWidth=1500
WindowRows=2
WindowColumns=6
# Independent label fonts in logical pixels; 9-32. They do not change app content.
WindowTitleFontSize=22
AppLabelFontSize=22
# Header icons appear immediately before window titles. Independent 12-64 logical pixels.
ShowWindowTitleIcons=true
WindowTitleIconSize=28
AppRows=2
ShowNotificationArea=true
NotificationIconSize=26
NotificationIconSpacing=8
ShowCloseButtons=true
ShowMonitorBadges=true
ShowAppLabels=true
ShowLivePreviews=true
QuickSizeButtons=true

# NAVIGATION
InterceptAltTab=true
StickyAltTab=true
# Genuine/borderless fullscreen foreground app only; not ordinary maximised title-bar windows.
MinimizeFullscreenOnOpen=true
EnableSearch=true
CurrentMonitorOnly=false
# Also dismisses Settings and its drafts without saving or reopening the menu.
HideOnFocusLoss=true
RightClickZones=true
KeepOpenAfterMove=false
EnableUndoMove=true
# Prefer verified shortcuts/Shell identities; false keeps the legacy taskbar action.
DirectAppLaunch=true
# Optional Terminal-only override, off by default. App settings and explicit arguments decide window behaviour.
TerminalNewWindow=false
# Existing matching windows are considered only after the new-window wait expires.
ReuseSingleInstance=true
LaunchTimeoutSeconds=15

# MONITORS AND ZONES
ReadFancyZones=true
RespectZoneSpacing=true
ShowBasicFallback=true
# BasicLayout: 0=halves, 1=thirds, 2=quarters
BasicLayout=1
ShowZoneNumbers=true
ShowZoneButtons=true
PickerWidth=1050
PickerHeight=650
FullScreenButtonHeight=52
FullScreenButtonMinWidth=190
ZoneLabelSize=15
ZoneInset=0
# Empty uses %LOCALAPPDATA%\Microsoft\PowerToys\FancyZones
FancyZonesFolder=
# Use Settings > Monitor layouts rather than editing the encoded mapping.
MonitorOverrides=

# Bottom action bar: integrated Search, favourites and optional desktop/clipboard buttons.
WindowsSearchButton=true
FavouritesButton=true
DesktopButton=true
ClipboardButton=false
FooterButtonHeight=40

# These keyboard shortcuts only apply while the Taskbar Tiles menu is active.
LocalHotkeys=true
MiddleClickClose=false
LiveSettingsPreview=true

# Configure the actual list in Settings > Favourites; it is saved in favourites.json.
FavouriteWidth=460
FavouriteRowHeight=56
FavouriteVisibleRows=8
FavouriteGroups=true
FavouriteDetails=true
FavouriteAlphabetical=false
FavouriteNumberKeys=true

# Maximum windows/page is WindowColumns x WindowRows.
# Visible rows are balanced bottom-heavy and centred independently.

# The legacy WindowsSearchButton key now controls Search inside Taskbar Tiles.
SearchInstalledApps=true
SearchOpenWindows=true
SearchFavourites=true
SearchSettings=true
SearchIndexedFiles=true
SearchPanelWidth=860
SearchVisibleRows=7
SearchRowHeight=54

# Touch Return: opt in only after the passive device test.
TouchSupportEnabled=false
TouchReturnDelayMs=1000
PenReturnDelayMs=2000
TouchReturnAction=0
TouchWaitForHover=true
TouchTypingCancels=true
TouchPauseForMenus=true
TouchMonitorRules=
TouchExcludedApps=
TouchPauseShortcut=
TouchStayShortcut=
TouchReturnShortcut=

# Auto-hide discovery is automatic and does not alter the Windows taskbar.
SearchButtonWidth=420
RecentAppsButton=true
RememberRecentApps=true
RecentObserveExternal=true
RecentAppsLimit=10
