name: Build and test
on:
  push:
    branches: [main, feature/stream-dock-module]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.27.1'
          cache: false
      - name: Compile application and modules, run helper tests and package installer
        shell: powershell
        run: |
          try { ./tools/Package.ps1 }
          finally {
            if (Test-Path build/app/self-test.log) { Get-Content build/app/self-test.log }
            if (Test-Path build/app/streamdock-test.log) { Get-Content build/app/streamdock-test.log }
          }
      - name: Test native default action and hidden app reopening
        shell: powershell
        run: ./tools/Test-AppReopen.ps1
      - name: Test auto-hide inventory search and recent apps
        shell: powershell
        run: ./tools/Test-LauncherExperience.ps1
      - name: Test real menu rendering and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test native outside-click dismissal
        shell: powershell
        run: ./tools/Test-OutsideClick.ps1
      - name: Test Touch Return policy and shortcut recovery
        shell: powershell
        run: ./tools/Test-TouchSupport.ps1
      - name: Test native switcher topmost ordering
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test native app-managed launch outcomes
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test actual updater HTTPS and verified download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Test actual installer, upgrades, Stream Dock choices and settings preservation
        shell: powershell
        run: ./tools/Test-Installer.ps1
      - name: Upload build, installer and test records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-and-tests
          path: |
            build/
            dist/
          if-no-files-found: warn
          retention-days: 14
