name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and run helper tests
        shell: powershell
        run: ./tools/Build.ps1
      - name: Test real menu rendering and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test native switcher topmost ordering
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test native app-managed launch outcomes
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test actual updater HTTPS and verified download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Upload build and test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-and-tests
          path: build/
          if-no-files-found: warn
          retention-days: 14
