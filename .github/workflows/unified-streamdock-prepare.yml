name: Apply unified Stream Dock overlay
on:
  push:
    branches: [feature/unified-streamdock-category-0.10.1]
    paths: [.github/workflows/unified-streamdock-prepare.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-streamdock-category-0.10.1
      - name: Apply reviewed overlay
        run: |
          cat preparation/unified-parts/part-* > "$RUNNER_TEMP/unified-overlay.b64"
          test "$(wc -c < "$RUNNER_TEMP/unified-overlay.b64")" = "72956"
          base64 -d "$RUNNER_TEMP/unified-overlay.b64" > "$RUNNER_TEMP/unified-overlay.tar.xz"
          echo "e90cad2724242c11a8b0cd5baf533e6fe584cc3a8019c2e9a292f559a680dc59  $RUNNER_TEMP/unified-overlay.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/unified-overlay.tar.xz"
          rm -rf preparation/unified-parts preparation/unified-overlay.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate Stream Dock actions under one Taskbar Tiles plugin (0.10.1)'
          git pull --rebase origin feature/unified-streamdock-category-0.10.1
          git push origin HEAD:feature/unified-streamdock-category-0.10.1
