name: Unified migration source completion
on:
  push:
    branches: [feature/unified-streamdock-category-0.10.1]
    paths: [.github/workflows/unified-source-review.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-streamdock-category-0.10.1
      - name: Apply exact reviewed source edits
        run: |
          python3 preparation/finalize-unified.py
          git rm preparation/finalize-unified.py
          git add src/TaskbarTiles/AssemblyInfo.cs src/TaskbarTiles/StreamDockModule.cs src/TaskbarTiles/StreamDockTests.cs src/TaskbarTiles/TaskbarTiles.csproj
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire the settings-preserving unified migration and rollback checks'
          git push origin HEAD:feature/unified-streamdock-category-0.10.1
          git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-source-review
          path: source.zip
          retention-days: 1
