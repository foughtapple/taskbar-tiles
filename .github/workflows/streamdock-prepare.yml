name: Stream Dock integration snapshot
on:
  push:
    branches: [feature/stream-dock-module]
    paths: [.github/workflows/streamdock-prepare.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive integration and main
        run: |
          git archive --format=zip --output=integration.zip HEAD
          git archive --format=zip --output=current-main.zip origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streamdock-final-source
          path: |
            integration.zip
            current-main.zip
          retention-days: 3
