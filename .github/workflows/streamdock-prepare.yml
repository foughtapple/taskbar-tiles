name: Stream Dock integration preparation
on:
  push:
    branches: [feature/stream-dock-module]
    paths: [.github/workflows/streamdock-prepare.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot exact integration baseline
        run: git archive --format=zip --output=taskbar-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taskbar-integration-source
          path: taskbar-source.zip
          retention-days: 1
