name: Stream Dock final integration validation
on:
  push:
    branches: [feature/stream-dock-module]
    paths: [.github/workflows/streamdock-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve current main and finish source integration
        id: source
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed={'src/TaskbarTiles/TaskbarTiles.cs','src/TaskbarTiles/AssemblyInfo.cs','version.txt','README.md','CHANGELOG.md','src/TaskbarTiles/TaskbarTiles.csproj'}
          if not set(paths)<=allowed:raise SystemExit('Unexpected merge conflict: '+str(paths))
          for p in paths:subprocess.check_call(['git','checkout','--theirs','--',p]);subprocess.check_call(['git','add',p])
          PY
          fi
          # Workflow content is updated through the authorised connector, not this source migration.
          git restore --source=HEAD --staged --worktree .github/workflows
          if [ -f tools/Finish-StreamDock-Source.py ]; then
            python3 tools/Finish-StreamDock-Source.py
            rm tools/Finish-StreamDock-Source.py
          fi
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('tools/Build-StreamDock.ps1');s=p.read_text()
          s=s.replace("Build-Go (Join-Path $module 'src') $exe\n        Run-Checked $exe '--validate' (Split-Path $exe)\n      }\n      'orders'", "Build-Go (Join-Path $module 'src') $exe\n        Run-Checked $exe '--validate-assets' (Split-Path $exe)\n      }\n      'orders'")
          p.write_text(s)
          p=pathlib.Path('THIRD-PARTY-NOTICES.txt');s=p.read_text();s=s.replace(' Steam account status uses a Font Awesome Steam mark (CC BY 4.0; included notice).',' The Steam fallback symbol is a vector trace of the supplied Steam icon.');p.write_text(s)
          PY
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Integrate final Stream Dock module with current Taskbar Tiles and safe bundled updates'; fi
          git push origin HEAD:feature/stream-dock-module
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=final-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-streamdock-source
          path: final-source.zip
          retention-days: 7
  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: stable
          cache: false
      - name: Build, test and package complete application and modules
        shell: powershell
        run: |
          try { ./tools/Package.ps1 }
          finally { if (Test-Path build/app/self-test.log) { Get-Content build/app/self-test.log }; if (Test-Path build/app/streamdock-test.log) { Get-Content build/app/streamdock-test.log } }
      - name: Existing taskbar regression tests
        shell: powershell
        run: |
          ./tools/Test-AppReopen.ps1
          ./tools/Test-LauncherExperience.ps1
          ./tools/Test-Rendering.ps1
          ./tools/Test-OutsideClick.ps1
          ./tools/Test-TouchSupport.ps1
          ./tools/Test-SwitcherLayer.ps1
          ./tools/Test-AppLaunch.ps1
          ./tools/Test-UpdateHttps.ps1
      - name: Actual installer and plugin upgrade tests on disposable runner
        shell: powershell
        run: ./tools/Test-Installer.ps1
      - name: Keep installer and complete test records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streamdock-windows-final
          path: |
            dist/
            build/
          retention-days: 14
