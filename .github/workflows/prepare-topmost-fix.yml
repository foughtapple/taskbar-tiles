name: Validate switcher topmost fix
on:
  push:
    branches: ['fix/switcher-topmost-0.7.3']
    paths: ['.maintenance/apply073.py', '.github/workflows/prepare-topmost-fix.yml', 'src/TaskbarTiles/SwitcherLayer*.cs', 'tools/Test-SwitcherLayer.ps1']
permissions:
  contents: read
concurrency:
  group: prepare-switcher-topmost-073
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'foughtapple/taskbar-tiles'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact source edits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/fix/switcher-topmost-0.7.3') { throw 'Unexpected branch.' }
          & python .maintenance/apply073.py
          if ($LASTEXITCODE -ne 0) { throw 'Source assertions failed. Nothing is pushed.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
      - name: Compile and run full helper suite
        shell: powershell
        run: ./tools/Build.ps1
      - name: Verify native switcher Z order
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Verify actual updater HTTPS and download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Commit tested source on the fix branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Permanent workflow edits will be applied through the maintainer connector,
          # not through a job token which intentionally lacks workflow-write scope.
          & git restore -- .github/workflows/build.yml .github/workflows/release.yml
          if ($LASTEXITCODE -ne 0) { throw 'Could not reset unstaged workflow edits.' }
          & git add -- src/TaskbarTiles version.txt CHANGELOG.md
          & git rm -- .maintenance/apply073.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove one-time source editor.' }
          & git commit -m 'Keep switcher above apps without fighting selected-window activation (0.7.3)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit tested source.' }
          & gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication setup failed.' }
          & git push origin HEAD:refs/heads/fix/switcher-topmost-0.7.3
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; no force-push is used.' }
      - name: Retain validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switcher-topmost-073-validation
          path: build/
          if-no-files-found: warn
          retention-days: 14
