name: Validate launch placement fix
on:
  push:
    branches: ['fix/launch-placement-0.7.1']
    paths: ['.maintenance/apply071.py', '.github/workflows/prepare-launch-fix.yml', 'src/TaskbarTiles/LaunchResolution*.cs']
permissions:
  contents: read
concurrency:
  group: prepare-launch-placement-071
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'foughtapple/taskbar-tiles'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact source edits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/fix/launch-placement-0.7.1') { throw 'Unexpected branch.' }
          & python .maintenance/apply071.py
          if ($LASTEXITCODE -ne 0) { throw 'Source assertions failed. Nothing is pushed.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
      - name: Compile and run full helper suite
        shell: powershell
        run: ./tools/Build.ps1
      - name: Commit tested source on the fix branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- src/TaskbarTiles version.txt
          & git rm -- .maintenance/apply071.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the one-time source-edit helper.' }
          & git commit -m 'Fix launch identity matching, hosted frames and Settings updates (0.7.1)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit tested source.' }
          & gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication setup failed.' }
          & git push origin HEAD:refs/heads/fix/launch-placement-0.7.1
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced or push rejected. No force push is used.' }
      - name: Retain build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launch-placement-071-validation
          path: build/
          if-no-files-found: warn
          retention-days: 14
