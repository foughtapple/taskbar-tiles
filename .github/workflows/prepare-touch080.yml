name: Validate shortcut recovery and touch support
on:
  push:
    branches: ['feature/touch-support-shortcut-recovery-0.8.0']
permissions:
  contents: write
concurrency:
  group: prepare-touch080
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed source integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/feature/touch-support-shortcut-recovery-0.8.0') { throw 'Wrong branch.' }
          & python .maintenance/apply080.py
          if ($LASTEXITCODE -ne 0) { throw 'Source integration assertions failed.' }
          & python .maintenance/finalize080.py
          if ($LASTEXITCODE -ne 0) { throw 'Safety review assertions failed.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
      - name: Compile and run helper regressions
        shell: powershell
        run: ./tools/Build.ps1
      - name: Test actual menu rendering and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test Touch Return policy and native shortcut recovery
        shell: powershell
        run: ./tools/Test-TouchSupport.ps1
      - name: Test nonactivating outside-click dismissal
        shell: powershell
        run: ./tools/Test-OutsideClick.ps1
      - name: Test native topmost ordering
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test app-managed launch outcomes
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test production updater HTTPS and verified download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Commit only tested source on this feature branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- src/TaskbarTiles version.txt config/settings.ini CHANGELOG.md .github/workflows/build.yml .github/workflows/release.yml docs tools/Test-TouchSupport.ps1
          & git rm -- .maintenance/apply080.py .maintenance/finalize080.py
          if ($LASTEXITCODE -ne 0) { throw 'One-time helper removal failed.' }
          & git commit -m 'Recover shortcuts and add capability-gated Touch Return (0.8.0)'
          if ($LASTEXITCODE -ne 0) { throw 'No tested commit created.' }
          & gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication setup failed.' }
          & git push origin HEAD:refs/heads/feature/touch-support-shortcut-recovery-0.8.0
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed or push rejected. No force push is used.' }
      - name: Keep test records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: touch080-validation
          path: build/
          if-no-files-found: warn
          retention-days: 14
