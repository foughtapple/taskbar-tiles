name: Release
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['version.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'foughtapple/taskbar-tiles' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify tag and repository
        shell: powershell
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          if ($env:GITHUB_REF -ne 'refs/heads/main' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match version.txt.' }
          $tag = "v$version"
          $known = & git tag --list $tag
          if ($known) {
            $tagCommit = (& git rev-parse "$tag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) { throw 'Existing version tag points to another commit. Use a new version.' }
          }
          if ($env:GITHUB_REPOSITORY -cne 'foughtapple/taskbar-tiles') { throw 'Forks must change their updater repository and release workflow before publishing.' }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Missing release notes.' }
      - name: Compile application and module payloads, test and package installer
        shell: powershell
        run: |
          try { ./tools/Package.ps1 }
          finally {
            if (Test-Path build/app/self-test.log) { Get-Content build/app/self-test.log }
            if (Test-Path build/app/streamdock-test.log) { Get-Content build/app/streamdock-test.log }
          }
      - name: Test native default actions and hidden app reopening
        shell: powershell
        run: ./tools/Test-AppReopen.ps1
      - name: Test notification-area mirror actions
        shell: powershell
        run: ./tools/Test-NotificationArea.ps1
      - name: Test auto-hide inventory search and recent apps
        shell: powershell
        run: ./tools/Test-LauncherExperience.ps1
      - name: Test real menu rendering and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test native outside-click dismissal
        shell: powershell
        run: ./tools/Test-OutsideClick.ps1
      - name: Test Touch Return policy and shortcut recovery
        shell: powershell
        run: ./tools/Test-TouchSupport.ps1
      - name: Test native switcher topmost ordering
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test native app-managed launch outcomes
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test actual updater HTTPS and verified download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Test installer upgrades, module choices and preserved settings
        shell: powershell
        run: ./tools/Test-Installer.ps1
      - name: Record build provenance
        shell: powershell
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $catalog = Get-Content build/app/streamdock/catalog.json -Raw | ConvertFrom-Json
          @{
            version = $version
            commit = $env:GITHUB_SHA
            run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            built_utc = (Get-Date).ToUniversalTime().ToString('o')
            runner = 'windows-2022'
            go_version = (& go version)
            helper_tests = 'passed'
            streamdock_packages = @($catalog.Packages | Select-Object Id,Version,SHA256)
            streamdock_manager_tests = 'passed: checksums, archive paths, action choices, opt-out, busy host refusal, rollback, private settings and real settings-page painting'
            streamdock_installer_tests = 'passed: actual Setup upgrade synchronises enabled modules, preserves private settings, keeps disabled actions off and leaves unrelated plugins untouched'
            app_reopen_tests = 'passed: native default actions and out-of-process hidden-window fixture; actual Steam client not exercised'
            notification_area_tests = 'passed: compact row geometry/policy plus cross-process Invoke and context-menu-key fixture; personalised Windows notification area not tested'
            launcher_experience_tests = 'passed: offscreen policy, search, geometry, recent-history persistence and real Forms painting'
            native_clickaway_tests = 'passed on disposable nonactivating windows'
            touch_shortcut_tests = 'passed: policy, listener lifecycle and recovery; no hardware compatibility claim'
            native_rendering_tests = 'passed: real-menu/preview rendering, icon isolation and bounded recovery'
            native_switcher_layer_tests = 'passed on disposable Forms'
            native_app_managed_launch_tests = 'passed on disposable out-of-process fixtures'
            updater_https_download_checksum_test = 'passed; downloaded installer not executed by network test'
            installer_smoke_tests = 'passed'
            interactive_desktop_tests = 'physical Stream Dock 293S, real Steam accounts, printer and MCP store endpoint not tested'
            authenticode_signed = $false
          } | ConvertTo-Json -Depth 8 | Set-Content dist/build-info.json -Encoding UTF8
      - name: Publish only after all tests pass
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content version.txt -Raw).Trim()
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $known = & git tag --list $tag
          if (-not $known) {
            & gh api "repos/$repo/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the immutable version tag. No existing tag changed.' }
          }
          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $existing = & gh release view $tag --repo $repo --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $savedPreference
          if ($exists) {
            $data = $existing | ConvertFrom-Json
            if (-not $data.isDraft) { throw 'Published release exists. Never overwrite published assets; issue a new version.' }
          } else {
            & gh release create $tag --repo $repo --verify-tag --draft --title "Taskbar Tiles $version" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          & gh release upload $tag "dist/TaskbarTiles-$version-Setup.exe" dist/SHA256SUMS.txt dist/build-info.json --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; release remains unpublished.' }
          & gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release assets uploaded but publication failed.' }
      - name: Keep installer and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics-${{ github.ref_name }}
          path: |
            build/
            dist/
          if-no-files-found: warn
          retention-days: 30
