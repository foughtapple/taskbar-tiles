name: Validate menu rendering recovery
on:
  push:
    branches: ['fix/rendering-recovery-0.7.5']
    paths: ['.maintenance/apply075.py', '.github/workflows/prepare-rendering-fix.yml', 'src/TaskbarTiles/Rendering*.cs']
permissions:
  contents: read
concurrency:
  group: prepare-rendering-075
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'foughtapple/taskbar-tiles'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact source edits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/fix/rendering-recovery-0.7.5') { throw 'Unexpected branch.' }
          & python .maintenance/apply075.py
          if ($LASTEXITCODE -ne 0) { throw 'Source assertions failed. Nothing is pushed.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
      - name: Compile and run helper regressions
        shell: powershell
        run: ./tools/Build.ps1
      - name: Test real menu painting and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test native switcher Z order
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test app-managed launches
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test actual updater HTTPS and download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Commit tested source on the fix branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- src/TaskbarTiles version.txt CHANGELOG.md
          & git rm -- .maintenance/apply075.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the one-time source helper.' }
          & git commit -m 'Fix menu font lifetime and contain recoverable drawing failures (0.7.5)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit tested source.' }
          & gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication setup failed.' }
          & git push origin HEAD:refs/heads/fix/rendering-recovery-0.7.5
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed or push rejected. No force push is used.' }
      - name: Retain validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendering-075-validation
          path: build/
          if-no-files-found: warn
          retention-days: 14
