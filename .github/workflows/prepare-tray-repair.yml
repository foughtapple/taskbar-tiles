name: Prepare tray repair source
on:
  push:
    branches: ['fix/tray-menu-artwork-0.14.1']
    paths: ['tools/apply_tray_repair.py', '.github/workflows/prepare-tray-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'foughtapple/taskbar-tiles' && github.ref == 'refs/heads/fix/tray-menu-artwork-0.14.1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Apply bounded source edits and remove this preparation workflow
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/apply_tray_repair.py
          git diff --check
          git config user.name 'foughtapple'
          git config user.email '209427465+foughtapple@users.noreply.github.com'
          git add -A
          git commit -m 'Fix tray context menu lifecycle and hidden-icon artwork (0.14.1)'
          git push origin HEAD:fix/tray-menu-artwork-0.14.1
