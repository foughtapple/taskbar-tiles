name: Validate auto-hide search and recent apps
on:
  push:
    branches: ['feature/autohide-search-recents-0.9.0']
    paths: ['.maintenance/apply090.py', 'src/TaskbarTiles/LauncherInventory.cs', 'src/TaskbarTiles/RecentApps.cs', 'src/TaskbarTiles/WindowsSettingsCatalog.cs', 'src/TaskbarTiles/LauncherExperienceTests.cs', '.github/workflows/prepare-launcher090.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed source edits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/feature/autohide-search-recents-0.9.0') { throw 'Unexpected branch.' }
          & python .maintenance/apply090.py
          if ($LASTEXITCODE -ne 0) { throw 'Source assertions failed. No changes are pushed.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed.' }
      - name: Compile and run helper regressions
        shell: powershell
        run: ./tools/Build.ps1
      - name: Test launcher inventory search recent history and UI
        shell: powershell
        run: ./tools/Test-LauncherExperience.ps1
      - name: Test real menu rendering and recovery
        shell: powershell
        run: ./tools/Test-Rendering.ps1
      - name: Test native outside-click dismissal
        shell: powershell
        run: ./tools/Test-OutsideClick.ps1
      - name: Test touch detection and shortcut recovery
        shell: powershell
        run: ./tools/Test-TouchSupport.ps1
      - name: Test native switcher topmost ordering
        shell: powershell
        run: ./tools/Test-SwitcherLayer.ps1
      - name: Test app-managed launches
        shell: powershell
        run: ./tools/Test-AppLaunch.ps1
      - name: Test actual updater HTTPS and verified download
        shell: powershell
        run: ./tools/Test-UpdateHttps.ps1
      - name: Commit only tested source on feature branch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- src/TaskbarTiles tools/Test-LauncherExperience.ps1 config/settings.ini docs/releases/v0.9.0.md README.md CHANGELOG.md version.txt
          & git rm -- .maintenance/apply090.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove preparation helper.' }
          & git commit -m 'Support auto-hidden taskbars, expand integrated settings search and add recent apps (0.9.0)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit tested source.' }
          & gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Git authentication failed.' }
          & git push origin HEAD:refs/heads/feature/autohide-search-recents-0.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed or push rejected; no force push is used.' }
      - name: Retain validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-090-validation
          path: build/
          if-no-files-found: warn
          retention-days: 14
